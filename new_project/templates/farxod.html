<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DSDS</title>
</head>
<body>

    <h2>Django</h2>
    {% for item in news %}
        <div style="border: 1px solid #ccc; margin: 20px; padding: 15px;">
            <h3>{{ item.title }}</h3>
            <p>{{ item.body }}</p>
            <p><strong>Kategoriya:</strong> {{ item.category }}</p>
            <p><small>Sana: {{ item.publish_time }}</small></p>

            {% if item.image %}
                <div>
                    <img src="{{ item.image.url }}" alt="Yangilik rasmi" width="300">
                </div>
            {% endif %}

            {% if item.video %}
                <div style="margin-top: 10px;">
                    <video width="320" height="240" controls>
                        <source src="{{ item.video.url }}" type="video/mp4">
                    </video>
                </div>
            {% endif %}
        </div>
    {% empty %}
        <p>Hozircha yangiliklar qo'shilmagan.</p>
    {% endfor %}

</body>
</html>
